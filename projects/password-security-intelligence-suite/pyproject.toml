[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "passintel"
version = "1.0.0"
description = "Privacy-first password security intelligence toolkit"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Zakaria Al-Rawi"}]
license = {text = "MIT"}
keywords = ["cybersecurity", "password-security", "defensive-security", "python"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.scripts]
passintel = "passintel.cli:main"

[tool.setuptools.packages.find]
include = ["passintel*"]
